<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="790" viewBox="0 0 1150 790"><title>Offline ESP32 door, LDR divider and common cathode RGB LED</title><rect width="1150" height="790" fill="white"/><g font-family="sans-serif" font-size="17" fill="#152536"><text x="25" y="35">ID6 — ESP32 low-voltage offline automation, USB power</text><rect x="40" y="140" width="300" height="380" fill="#e6f1ff" stroke="#152536"/><text x="65" y="175">ESP32 DevKit</text><text x="65" y="220">3V3</text><text x="65" y="265">GND</text><text x="65" y="310">GPIO34 ADC1</text><text x="65" y="355">GPIO27 INPUT_PULLUP</text><text x="65" y="400">GPIO25 PWM red</text><text x="65" y="445">GPIO26 PWM green</text><text x="65" y="490">GPIO33 PWM blue</text><text x="780" y="190">Photoresistor / LDR</text><text x="780" y="280">10 kΩ to ground</text><text x="650" y="345">Reed door contact</text><rect x="650" y="380" width="90" height="30" fill="#fff1d9" stroke="#b33"/><rect x="650" y="425" width="90" height="30" fill="#fff1d9" stroke="#187c4b"/><rect x="650" y="470" width="90" height="30" fill="#fff1d9" stroke="#276bc2"/><text x="660" y="403">330 Ω</text><text x="660" y="448">330 Ω</text><text x="660" y="493">330 Ω</text><rect x="850" y="370" width="240" height="190" fill="#f1edff" stroke="#152536"/><text x="875" y="402">RGB LED</text><text x="875" y="443">R anode</text><text x="875" y="483">G anode</text><text x="875" y="523">B anode</text><text x="875" y="550">Common cathode</text><text x="25" y="665">LDR: 3.3 V → LDR → ADC node → 10 kΩ → GND. Higher raw ADC means brighter.</text><text x="25" y="705">Reed closes GPIO27 to GND when magnet adjacent. Open input is pulled HIGH internally.</text><text x="25" y="745">All signals 3.3 V. One resistor per LED anode. Dots are junctions; crossings without dots are separate.</text></g><g fill="none" stroke-width="3"><path stroke="#c33" d="M340 215H440V100H760V155"/><path stroke="#333" d="M340 260H400V600H1110M760 300V600M1090 545H1110V600"/><path stroke="#176b68" d="M340 305H540V230H760"/><path stroke="#c33" d="M760 155L750 165L770 175L750 185L770 195L760 205V230"/><path stroke="#333" d="M760 230V250L750 260L770 270L750 280L770 290L760 300"/><path stroke="#176b68" d="M340 350H580V330H630M670 330H700V600M630 330L663 312"/><path stroke="#b33" d="M340 395H650M740 395H800V435H850"/><path stroke="#187c4b" d="M340 440H650M740 440H790V475H850"/><path stroke="#276bc2" d="M340 485H650M740 485H780V515H850"/></g><g fill="#333"><circle cx="760" cy="230" r="5"/><circle cx="760" cy="600" r="5"/><circle cx="700" cy="600" r="5"/><circle cx="1110" cy="600" r="5"/></g></svg>